name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (first run only, safe to repeat)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Install app icon
        run: |
          RES=android/app/src/main/res
          mkdir -p "$RES/values" "$RES/mipmap-anydpi-v26"
          cp android-icons/values/ic_launcher_background.xml "$RES/values/ic_launcher_background.xml"
          cp android-icons/mipmap-anydpi-v26/ic_launcher.xml "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          cp android-icons/mipmap-anydpi-v26/ic_launcher_round.xml "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp "android-icons/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher.png"
            cp "android-icons/mipmap-$d/ic_launcher_round.png" "$RES/mipmap-$d/ic_launcher_round.png"
            cp "android-icons/mipmap-$d/ic_launcher_foreground.png" "$RES/mipmap-$d/ic_launcher_foreground.png"
          done

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adpay-bd-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
