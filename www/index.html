function WatchAdModal({ onClose, onRewarded, lang, advertiser = "Classy Bro" }) {
  const [phase, setPhase] = useState("loading"); // loading -> playing -> verifying -> rewarded
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    const t1 = setTimeout(() => setPhase("playing"), 900);
    return () => clearTimeout(t1);
  }, []);

  useEffect(() => {
    if (phase !== "playing") return;
    const interval = setInterval(() => {
      setProgress((p) => {
        if (p >= 100) {
          clearInterval(interval);
          setPhase("verifying");
          return 100;
        }
        return p + 4;
      });
    }, 120);
    return () => clearInterval(interval);
  }, [phase]);

  useEffect(() => {
    if (phase !== "verifying") return;
    const t = setTimeout(() => setPhase("rewarded"), 1100);
    return () => clearTimeout(t);
  }, [phase]);

  return (
    <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-none w-full max-w-sm overflow-hidden border-[3px] border-black brutal-shadow-lg relative">
        {phase !== "rewarded" && (
          <button onClick={onClose} className="absolute right-3 top-3 w-8 h-8 flex items-center justify-center bg-white border-2 border-black z-10 brutal-press brutal-shadow-sm">
            <X size={16} strokeWidth={3} />
          </button>
        )}
        {phase === "loading" && (
          <div className="h-80 flex flex-col items-center justify-center gap-3 bg-[#000D2B] text-white">
            <div className="w-10 h-10 border-[3px] border-white/30 border-t-[#FDC601] rounded-full animate-spin" />
            <p className="text-sm font-bold uppercase tracking-wide">Requesting rewarded ad…</p>
          </div>
        )}
        {phase === "playing" && (
          <div className="h-80 flex flex-col items-center justify-center gap-4 relative bg-[#000D2B]">
            <Sparkles className="text-[#FDC601]" size={40} strokeWidth={2.5} />
            <p className="text-white font-bold text-sm">Ad from {advertiser}…</p>
            <div className="w-4/5 h-3 bg-white border-2 border-black overflow-hidden">
              <div className="h-full bg-[#0168C0]" style={{ width: `${progress}%` }} />
            </div>
            <p className="text-white/50 text-xs font-medium">Watch to the end to earn your share</p>
          </div>
        )}
        {phase === "verifying" && (
          <div className="h-80 flex flex-col items-center justify-center gap-3 bg-[#000D2B] text-white">
            <Shield className="text-[#FDC601] animate-pulse" size={36} strokeWidth={2.5} />
            <p className="text-sm font-bold uppercase tracking-wide">Verifying completion…</p>
            <p className="text-white/40 text-xs font-medium">Checking against campaign budget</p>
          </div>
        )}
        {phase === "rewarded" && (
          <div className="h-80 flex flex-col items-center justify-center gap-4 px-6 text-center bg-[#7CFC9A]">
            <div className="w-16 h-16 rounded-full bg-white border-[3px] border-black flex items-center justify-center brutal-shadow-sm">
              <CheckCircle2 className="text-black" size={36} strokeWidth={2.5} />
            </div>
            <div>
              <p className="text-black font-black text-lg uppercase">Ad completed!</p>
              <p className="text-black text-4xl font-black mt-1.5 tabular-nums" style={{ fontFamily: "'Archivo Black', sans-serif" }}>+৳{EARNING_PER_TASK_BDT}</p>
              <p className="text-black/70 text-xs font-bold mt-1">ADDED TO YOUR BALANCE</p>
              <p className="text-black/50 text-[11px] mt-2 font-medium">Your 30% share of this view, from {advertiser}'s payment</p>
            </div>
            <button
              onClick={() => onRewarded(EARNING_PER_TASK_BDT)}

            >

function UserApp({ lang, setLang }) {
  const [tab, setTab] = useState("dashboard");
  const [showAd, setShowAd] = useState(false);
  const [showWithdraw, setShowWithdraw] = useState(false);
  const [showShare, setShowShare] = useState(false);
  const [user, setUser] = useState(MOCK_USER);
  const t = COPY[lang];

  const handleRewarded = (amount) => {
    setUser((u) => ({
      ...u,
      availableBalance: u.availableBalance + amount,
      totalEarnedAllTime: u.totalEarnedAllTime + amount,
      tasksToday: u.tasksToday + 1,
    }));
    setShowAd(false);
  };

  const handleWithdrawSubmitted = (amount) => {
    setUser((u) => ({ ...u, availableBalance: u.availableBalance - amount }));
    setShowWithdraw(false);
  };

  const handleShareSubmitted = (amount) => {
    // Share earnings land in pendingBalance, not availableBalance — admin review gates the real payout,
    // same "never a projection" rule as ad revenue.
    setUser((u) => ({
      ...u,
      pendingBalance: u.pendingBalance + amount,
      totalEarnedAllTime: u.totalEarnedAllTime + amount,
      sharesToday: u.sharesToday + 1,
    }));
    setShowShare(false);
  };

  const handleFacebookIdSave = (fbId) => {
    setUser((u) => ({ ...u, facebookId: fbId }));
  };

  const tabs = [
    { id: "dashboard", label: t.dashboard, icon: Home, color: "#0168C0" },
    { id: "earn", label: t.earn, icon: Play, color: "#0168C0" },
    { id: "board", label: t.board, icon: Trophy, color: "#0168C0" },
    { id: "profile", label: t.profile, icon: User, color: "#0168C0" },
  ];

  return (
    <div className="max-w-sm mx-auto bg-[#FFF8E7] min-h-screen relative" style={{ fontFamily: "Inter, sans-serif" }}>
      <TopBar lang={lang} setLang={setLang} appName={t.appName} />

      {tab === "dashboard" && <DashboardScreen user={user} lang={lang} t={t} onWatchClick={() => setShowAd(true)} onWithdrawClick={() => setShowWithdraw(true)} onShareClick={() => setShowShare(true)} />}
      {tab === "earn" && <DashboardScreen user={user} lang={lang} t={t} onWatchClick={() => setShowAd(true)} onWithdrawClick={() => setShowWithdraw(true)} onShareClick={() => setShowShare(true)} />}
      {tab === "board" && <LeaderboardScreen user={user} />}
      {tab === "profile" && <ProfileScreen user={user} onWithdrawClick={() => setShowWithdraw(true)} onFacebookIdSave={handleFacebookIdSave} />}

      {showAd && <WatchAdModal onClose={() => setShowAd(false)} onRewarded={handleRewarded} lang={lang} advertiser={MOCK_CAMPAIGNS[0].advertiser} />}
      {showWithdraw && <WithdrawModal user={user} onClose={() => setShowWithdraw(false)} onSubmitted={handleWithdrawSubmitted} />}
      {showShare && <ShareTaskModal user={user} onClose={() => setShowShare(false)} onSubmitted={handleShareSubmitted} />}

      {/* Bottom nav */}
      <div className="fixed bottom-0 left-0 right-0 max-w-sm mx-auto bg-white border-t-[3px] border-black flex justify-around py-2 px-2">
        {tabs.map(({ id, label, icon: Icon, color }) => (
          <button
            key={id}
            onClick={() => setTab(id)}
            className="flex flex-col items-center gap-1 px-3 py-1.5 relative"
          >
            {id === "earn" ? (
              <div className="w-12 h-12 -mt-6 flex items-center justify-center bg-[#FDC601] border-[3px] border-black brutal-shadow-sm">
                <Icon size={20} className="text-black" fill="currentColor" strokeWidth={2.5} />
              </div>
            ) : (
              <Icon size={20} strokeWidth={2.5} style={{ color: tab === id ? color : "#B0AA9A" }} />
            )}
            <span className="text-[10px] font-black uppercase" style={{ color: tab === id ? color : "#B0AA9A" }}>{label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}
